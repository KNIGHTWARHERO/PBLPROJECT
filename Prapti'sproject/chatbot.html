<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chatbot | Museum Ticket Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f7f7f7;
      margin: 0;
      padding: 0;
    }

    .chat-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(120deg, #4b6cb7, #182848);
    }

    .chatbox {
      width: 100%;
      max-width: 450px;
      background-color: #fff;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      height: 80vh;
      transform: translateY(30px);
      animation: fadeIn 1s ease-in-out;
    }

    .chat-header {
      background: #4b6cb7;
      padding: 16px;
      color: #fff;
      font-size: 1.2rem;
      font-weight: bold;
      text-align: center;
      border-bottom: 2px solid #182848;
    }

    .chat-messages {
      flex-grow: 1;
      overflow-y: auto;
      padding: 20px;
      background-color: #f5f5f5;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .chat-input-container {
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fafafa;
      border-top: 2px solid #f5f5f5;
    }

    .chat-input {
      width: 80%;
      padding: 12px;
      border-radius: 25px;
      border: 1px solid #ddd;
      font-size: 1rem;
      outline: none;
    }

    .send-btn {
      background: #4b6cb7;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 1rem;
    }

    .message {
      max-width: 70%;
      padding: 10px 20px;
      border-radius: 15px;
      font-size: 1rem;
    }

    .message.bot {
      background: #4b6cb7;
      color: white;
      align-self: flex-start;
      border-top-left-radius: 0;
    }

    .message.user {
      background: #e3e3e3;
      color: #333;
      align-self: flex-end;
      border-top-right-radius: 0;
    }

    .museum-button,
    .ticket-button {
      background: #ff416c;
      color: white;
      padding: 10px 20px;
      border-radius: 25px;
      margin-top: 10px;
      font-size: 1rem;
      border: none;
      cursor: pointer;
    }

    .ticket-button {
      background: #50b7f1;
    }

    .ticket-button:hover {
      background: #007bff;
    }

    .qr-image {
      width: 150px;
      margin-top: 20px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .total-price {
      text-align: center;
      font-weight: bold;
      font-size: 1.2rem;
      margin-top: 10px;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chatbox">
      <div class="chat-header">
        <i class="fas fa-robot"></i> Museum Assistant
      </div>
      <div class="chat-messages" id="chat-messages">
        <!-- Chat messages go here -->
      </div>
      <div class="chat-input-container">
        <input type="text" id="chat-input" class="chat-input" placeholder="Ask me anything..."/>
        <button id="send-btn" class="send-btn">
          <i class="fas fa-paper-plane"></i>
        </button>
      </div>
    </div>
  </div>

  <script>
    const sendBtn = document.getElementById('send-btn');
    const chatInput = document.getElementById('chat-input');
    const chatMessages = document.getElementById('chat-messages');

    const museums = {
      "National Museum, Delhi": { priceAdult: 25, priceChild: 12, description: "Explore India's rich history..." },
      "CSMVS, Mumbai": { priceAdult: 28, priceChild: 13, description: "A heritage museum showcasing..." },
      "Indian Museum, Kolkata": { priceAdult: 30, priceChild: 15, description: "India's oldest museum..." },
      "Victoria Memorial, Kolkata": { priceAdult: 25, priceChild: 12, description: "Iconic white marble museum..." },
      "Albert Hall, Jaipur": { priceAdult: 27, priceChild: 14, description: "A beautiful Indo-Saracenic museum..." }
    };

    let selectedMuseum = "";
    let awaitingTicketInput = false;

    const botMessages = [
      "Hey there! 👋 Welcome to the Museum Explorer.",
      "I can assist with booking tickets or museum info. 😄"
    ];

    const botGreeting = () => {
      botMessages.forEach((msg, idx) => {
        setTimeout(() => addMessage(msg, 'bot'), idx * 1500);
      });
    };

    const addMessage = (message, sender) => {
      const messageElem = document.createElement('div');
      messageElem.classList.add('message', sender);
      messageElem.textContent = message;
      chatMessages.appendChild(messageElem);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    };

    const sendMessage = () => {
      const message = chatInput.value.trim();
      if (message) {
        addMessage(message, 'user');
        handleUserMessage(message);
        chatInput.value = '';
      }
    };

    const handleUserMessage = (message) => {
      if (awaitingTicketInput && selectedMuseum) {
        const numbers = message.match(/\d+/g);
        if (numbers && numbers.length >= 2) {
          const adults = parseInt(numbers[0]);
          const children = parseInt(numbers[1]);
          const museumData = museums[selectedMuseum];
          const total = (adults * museumData.priceAdult) + (children * museumData.priceChild);
          
          addMessage(`Generating QR for ${adults} adult(s) and ${children} child(ren)...`, 'bot');

          // Show QR image
          const qrImg = document.createElement('img');
          qrImg.src = 'qr-code.jpg';
          qrImg.alt = 'QR Code';
          qrImg.className = 'qr-image';
          chatMessages.appendChild(qrImg);

          // Show total price
          const priceElem = document.createElement('div');
          priceElem.className = 'total-price';
          priceElem.textContent = `Total Price: ₹${total}`;
          chatMessages.appendChild(priceElem);

          chatMessages.scrollTop = chatMessages.scrollHeight;
          awaitingTicketInput = false;
          selectedMuseum = "";
        } else {
          addMessage("Please enter the number of adults and children, e.g., '2 adults and 1 child'", 'bot');
        }
        return;
      }

      if (/hi|hello|hey/i.test(message)) {
        addMessage("Hello! 👋 I'm here to help with museum info or ticket booking!", 'bot');
        return;
      }

      if (message.toLowerCase().includes("ticket")) {
        addMessage("Sure! 🎟️ Which museum would you like to visit?", 'bot');
        showMuseumOptions();
        return;
      }

      if (message.toLowerCase().includes("museum")) {
        addMessage("Here are some top museums in India:", 'bot');
        showMuseumOptions();
        return;
      }

      addMessage("Sorry, I didn't understand that. Try asking about museum info or booking a ticket.", 'bot');
    };

    const showMuseumOptions = () => {
      Object.keys(museums).forEach(name => {
        const btn = document.createElement('button');
        btn.className = 'museum-button';
        btn.textContent = name;
        btn.onclick = () => chooseMuseum(name);
        chatMessages.appendChild(btn);
      });
      chatMessages.scrollTop = chatMessages.scrollHeight;
    };

    const chooseMuseum = (museum) => {
      selectedMuseum = museum;
      const data = museums[museum];
      addMessage(`You selected: ${museum}`, 'bot');
      addMessage(`Adult Price: ₹${data.priceAdult}, Child Price: ₹${data.priceChild}`, 'bot');

      const bookBtn = document.createElement('button');
      bookBtn.className = 'ticket-button';
      bookBtn.textContent = "Book Ticket";
      bookBtn.onclick = () => {
        addMessage("How many adults and children will be attending?", 'bot');
        awaitingTicketInput = true;
      };
      chatMessages.appendChild(bookBtn);

      const infoBtn = document.createElement('button');
      infoBtn.className = 'ticket-button';
      infoBtn.textContent = "Museum Info";
      infoBtn.onclick = () => addMessage(data.description, 'bot');
      chatMessages.appendChild(infoBtn);

      chatMessages.scrollTop = chatMessages.scrollHeight;
    };

    sendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', e => {
      if (e.key === 'Enter') sendMessage();
    });

    botGreeting();
  </script>
</body>
</html>
