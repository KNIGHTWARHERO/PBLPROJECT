<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Museum Ticket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(120deg, #e0eafc, #cfdef3);
      padding-top: 60px;
      padding-bottom: 60px;
    }

    h1 {
      text-align: center;
      font-weight: 800;
      font-size: 2.8rem;
      margin-bottom: 40px;
      color: #333;
    }

    .booking-form {
      max-width: 700px;
      margin: 0 auto;
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    label {
      font-weight: 600;
      margin-top: 20px;
    }

    .form-select, .form-control {
      border-radius: 8px;
      padding: 10px 15px;
    }

    .btn-submit {
      background: linear-gradient(to right, #4b6cb7, #182848);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 1.1rem;
      margin-top: 30px;
      transition: 0.3s;
    }

    .btn-submit:hover {
      background: linear-gradient(to right, #2c3e50, #4ca1af);
    }

    #qr-code-container {
      margin-top: 30px;
      text-align: center;
    }

    #total-amount {
      font-size: 1.4rem;
      font-weight: bold;
      margin-top: 20px;
      color: #222;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎟️ Book Your Museum Ticket</h1>
    <form class="booking-form" id="bookingForm">

      <div class="mb-3">
        <label for="museumSelect" class="form-label">Choose Museum</label>
        <select class="form-select" id="museumSelect" required>
          <option value="">-- Select a Museum --</option>
          <option value="National Museum, Delhi">National Museum, Delhi</option>
          <option value="CSMVS, Mumbai">CSMVS, Mumbai</option>
          <option value="Indian Museum, Kolkata">Indian Museum, Kolkata</option>
          <option value="Victoria Memorial">Victoria Memorial</option>
          <option value="Albert Hall, Jaipur">Albert Hall, Jaipur</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="nameInput" class="form-label">Your Name</label>
        <input type="text" class="form-control" id="nameInput" placeholder="Enter your full name" required>
      </div>

      <div class="mb-3">
        <label for="emailInput" class="form-label">Email address</label>
        <input type="email" class="form-control" id="emailInput" placeholder="you@example.com" required>
      </div>

      <div class="mb-3">
        <label for="dateInput" class="form-label">Visit Date</label>
        <input type="date" class="form-control" id="dateInput" required>
      </div>

      <div class="mb-3">
        <label for="adultTickets" class="form-label">Adult Tickets</label>
        <input type="number" class="form-control" id="adultTickets" min="0" value="0" required>
      </div>

      <div class="mb-3">
        <label for="childrenTickets" class="form-label">Children Tickets</label>
        <input type="number" class="form-control" id="childrenTickets" min="0" value="0" required>
      </div>

      <button type="button" class="btn btn-submit" onclick="generateRandomQR()">Confirm Booking</button>
    </form>

    <div id="qr-code-container"></div>
    <div id="total-amount"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script>
    const museumPrices = {
      "National Museum, Delhi": { adult: 25, child: 12 },
      "CSMVS, Mumbai": { adult: 30, child: 15 },
      "Indian Museum, Kolkata": { adult: 20, child: 10 },
      "Victoria Memorial": { adult: 35, child: 20 },
      "Albert Hall, Jaipur": { adult: 28, child: 14 }
    };

    function generateRandomQR() {
      const museum = document.getElementById('museumSelect').value;
      const adultTickets = parseInt(document.getElementById('adultTickets').value) || 0;
      const childrenTickets = parseInt(document.getElementById('childrenTickets').value) || 0;

      if (!museum || !(museum in museumPrices)) {
        alert("Please select a valid museum.");
        return;
      }

      const { adult, child } = museumPrices[museum];
      const total = (adultTickets * adult) + (childrenTickets * child);

      // Generate QR code with booking info
      const bookingData = {
        museum,
        adults: adultTickets,
        children: childrenTickets,
        totalAmount: total
      };

      const qrContainer = document.getElementById('qr-code-container');
      qrContainer.innerHTML = ''; // Clear previous

      QRCode.toCanvas(document.createElement('canvas'), JSON.stringify(bookingData), { width: 256 }, function (err, canvas) {
        if (err) console.error(err);
        qrContainer.appendChild(canvas);

        // Show total amount below QR
        document.getElementById('total-amount').innerText = `Total Amount: ₹${total}`;
      });
    }
  </script>
</body>
</html>
